[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "imo-python"
version = "0.7.0"
description = "Python client for IMO Web with QR login, messages, chat history, and file transfers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "imo-python" }]
keywords = ["imo", "imo-web", "messaging", "websocket"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = ["websocket-client>=1.8,<2"]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "twine>=6,<7",
    "qrcode>=7.4,<9",
]
qr = ["qrcode>=7.4,<9"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
imo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = [".runtime"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/test_web_batch.py" = ["F811"]
"tests/test_web_send.py" = ["F811"]
